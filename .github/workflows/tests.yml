name: Tests
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Tests current HA only. hacs.json declares HA 2024.1.0, which this code does
# not run on (see STANDARDS.md exception); no minimum job until that is resolved.
jobs:
  current:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@v1.0.0 # reviewed standards commit
    with:
      standards-ref: 44349ee5621eea5d80e5c427f7a2435d2c2491bb
      domain: esphome_ota
      python-versions: '["3.14"]'
      lint-python-version: '3.14'
      requirements: requirements_test.txt
      expected-ha-version: '2026.10.2'
      test-profile: ha
      ha-components: 'frontend panel_custom websocket_api http esphome'
      pytest-args: tests/components/esphome_ota/ -v --timeout 120
