name: Tests
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Tests current HA only. hacs.json declares HA 2024.11.0 (derived from the APIs the
# code uses); an exact-minimum job is not added yet (see STANDARDS.md exception).
jobs:
  current:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@v1.1.5 # reviewed standards commit
    with:
      domain: esphome_ota
      python-versions: '["3.14"]'
      lint-python-version: '3.14'
      requirements: requirements_test.txt
      test-profile: ha
      ha-components: 'frontend panel_custom websocket_api http esphome'
      pytest-args: tests/components/esphome_ota/ -v --timeout 120
