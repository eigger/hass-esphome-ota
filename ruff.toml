# Ruff configuration (ruff itself is pinned in requirements_lint.txt).
#
# Selection: E/F are the pycodestyle+pyflakes rules this codebase was already
# clean against (real errors: undefined names, unused imports, syntax issues).
[lint]
select = ["E", "F"]

# Long lines are pervasive in strings and log-message formatting and
# are not worth churning; everything else in E/F stays enforced.
ignore = ["E501"]

[lint.per-file-ignores]
"tests/*" = ["E402"]
